<p-table
    [value]="events"
    stripedRows
    [tableStyle]="{'min-width': '50rem'}">
        <ng-template #header>
            <tr>
                <th>Nom</th>
                <th>Description</th>
                <th>Date</th>
                <th>Lieu</th>
                <th>Prix</th>
                <th>Nombre de place (ticket mis en vente)</th>
                <th>Place disponibles</th>
                <th>Actions</th>
            </tr>
        </ng-template>
        <ng-template #body let-event>
            <tr>
                <td>{{ event.nom }}</td>
                <td>{{ event.description }}</td>
                <td>{{ event.date }}</td>
                <td>{{ event.lieu }}</td>
                <td>{{ event.prix }}</td>
                <td>{{ event.nom }}</td>
                <td>{{ event.placesDisponibles }}</td>
            </tr>
        </ng-template>
</p-table>
